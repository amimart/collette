[package]
name = "colette"
version = "0.1.0"
edition = "2021"
description = "Typed collections, indexes and scans over key-value stores"
license = "MIT"
repository = "https://github.com/amimart/colette"
readme = "README.md"
keywords = ["database", "index", "key-value", "storage"]
categories = ["database", "data-structures"]

[lib]
name = "colette"
path = "src/lib.rs"

[features]
default = ["memory"]
memory = []

[dependencies]
smallvec = "1.15.1"
thiserror = "2.0.18"
