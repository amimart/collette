[package]
name = "collette"
version = "0.3.0"
edition = "2021"
description = "Typed collections, indexes and scans over key-value stores"
license = "MIT"
repository = "https://github.com/amimart/collette"
readme = "README.md"
keywords = ["database", "index", "key-value", "storage"]
categories = ["database", "data-structures"]

[lib]
name = "collette"
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[features]
default = ["memory"]
memory = []
redb = ["dep:redb"]

[dependencies]
redb = { version = "4.1.0", optional = true }
smallvec = "1.15.1"
thiserror = "2.0.18"
