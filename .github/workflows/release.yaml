name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute and validate the release without pushing changes
        required: true
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  RELEASE_PRE_1_0_BREAKING_AS: minor
  GNUPGHOME: ${{ github.workspace }}/.gnupg

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - name: Ensure main branch
        if: github.ref_name != 'main'
        run: |
          echo "Releases must be run from main."
          exit 1

  build:
    name: Build
    needs: guard
    uses: ./.github/workflows/build.yaml

  test:
    name: Test
    needs: guard
    uses: ./.github/workflows/test.yaml

  lint:
    name: Lint
    needs: guard
    uses: ./.github/workflows/lint.yaml

  audit:
    name: Audit
    needs: guard
    uses: ./.github/workflows/audit.yaml

  release:
    name: Release
    needs:
      - build
      - test
      - lint
      - audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_GH_TOKEN }}

      - name: Plan release
        id: plan
        run: node scripts/prepare-release.mjs plan

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous_tag }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          args=(
            -f "tag_name=${TAG}"
            -f "target_commitish=main"
          )

          if [ -n "${PREVIOUS_TAG}" ]; then
            args+=(-f "previous_tag_name=${PREVIOUS_TAG}")
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${args[@]}" \
            --jq .body > release-notes.md

      - name: Update release files
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/prepare-release.mjs apply release-notes.md

      - name: Format changelog
        run: npx markdownlint-cli2 --fix CHANGELOG.md

      - name: Configure git signing
        if: inputs.dry_run == false
        env:
          RELEASE_GIT_USER_NAME: ${{ vars.RELEASE_GIT_USER_NAME }}
          RELEASE_GIT_USER_EMAIL: ${{ vars.RELEASE_GIT_USER_EMAIL }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -z "${RELEASE_GIT_USER_NAME}" ] || [ -z "${RELEASE_GIT_USER_EMAIL}" ]; then
            echo "::error::Set RELEASE_GIT_USER_NAME and RELEASE_GIT_USER_EMAIL repository variables."
            exit 1
          fi

          if [ -z "${RELEASE_GPG_PRIVATE_KEY}" ]; then
            echo "::error::Set RELEASE_GPG_PRIVATE_KEY repository secret."
            exit 1
          fi

          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"

          printf '%s' "${RELEASE_GPG_PRIVATE_KEY}" | gpg --batch --import

          signing_key="$(gpg --batch --list-secret-keys --with-colons \
            | awk -F: '/^sec:/ { print $5; exit }')"

          if [ -z "${signing_key}" ]; then
            echo "::error::Could not find an imported GPG signing key."
            exit 1
          fi

          printf '%s' "${RELEASE_GPG_PASSPHRASE}" > "${GNUPGHOME}/gpg-passphrase"
          chmod 600 "${GNUPGHOME}/gpg-passphrase"

          cat > "${GNUPGHOME}/gpg-wrapper" <<'EOF'
          #!/usr/bin/env bash
          exec gpg --batch --pinentry-mode loopback --passphrase-file "${GNUPGHOME}/gpg-passphrase" "$@"
          EOF
          chmod 700 "${GNUPGHOME}/gpg-wrapper"

          git config user.name "${RELEASE_GIT_USER_NAME}"
          git config user.email "${RELEASE_GIT_USER_EMAIL}"
          git config user.signingkey "${signing_key}"
          git config commit.gpgsign true
          git config tag.gpgsign true
          git config gpg.program "${GNUPGHOME}/gpg-wrapper"

      - name: Commit release
        if: inputs.dry_run == false
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git add CHANGELOG.md
          git commit -S -m "chore(release): ${TAG}"

      - name: Tag release
        if: inputs.dry_run == false
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: git tag -s "${TAG}" -m "${TAG}"

      - name: Push release commit and tag
        if: inputs.dry_run == false
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git push origin HEAD:main
          git push origin "${TAG}"

      - name: Create GitHub release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh release create "${TAG}" --title "${TAG}" --notes-file release-notes-clean.md
