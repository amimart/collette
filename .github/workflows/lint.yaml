name: Lint

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-rust:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  lint-markdown:
    name: Lint (Markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  lint-commits:
    name: Lint (Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yaml

  lint-yaml:
    name: Lint (YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint.yaml

  lint-nix:
    name: Lint (Nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Check flake
        run: |
          set -o pipefail

          nix flake check \
            --all-systems \
            --show-trace \
            --print-build-logs \
            2>&1 | tee /tmp/nix-flake-check.log

      - name: Reject Nix warnings
        run: |
          if grep -Ei '(^|[^[:alpha:]])warning:' /tmp/nix-flake-check.log; then
            echo "::error::Nix emitted one or more warnings"
            exit 1
          fi

      - name: Check formatting
        run: |
          mapfile -t nix_files < <(git ls-files '*.nix')
          nix develop --command nixfmt --check "${nix_files[@]}"

      - name: Statix
        run: nix develop --command statix check .

      - name: Deadnix
        run: nix develop --command deadnix --fail .
