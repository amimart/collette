area:ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .commitlintrc.yaml
          - .markdownlint.yaml
          - .yamllint.yaml
          - Makefile

area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - LICENSE

area:crate:
  - changed-files:
      - any-glob-to-any-file:
          - Cargo.toml
          - Cargo.lock
          - rust-toolchain.toml

area:backend:
  - changed-files:
      - any-glob-to-any-file:
          - src/backend/**
          - src/store.rs

area:tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**
          - src/**/tests.rs
